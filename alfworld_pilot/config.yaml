# Stage 2 (ALFWorld pilot) config. See ../CLAUDE.md for the research context.

env:
  # ALFWorld is installed (WSL2 Ubuntu; see README.md). "mock" is used by
  # the unit test suite only -- real pilot runs use "real".
  backend: real   # mock | real
  # Raised 30 -> 50 (2026-09-19, see step_cap_check.py / results/step_cap_check.json):
  # at 30 steps, an OPTIMAL scripted policy only solves pick_two_obj_and_place 18% of
  # the time (vs. 78-92% for every other task type) -- that's not a difficulty gap, it's
  # a near-guaranteed structural failure for one task type regardless of memories. Raising
  # to 40 barely helps (22%); 50 (ALFWorld's own standard research cap) brings EVERY task
  # type to ~100% optimal-policy solvability while still leaving a real difficulty gap for
  # a fallible real agent (more steps = more chances to err), which is the confound this
  # pilot's OPE method is built to correct for -- not "impossible by construction".
  max_steps: 50
  # config passed through to alfworld's own get_environment(...) when backend=real;
  # unused by the mock backend. Resolved relative to this file's directory (see config.py).
  real_alfworld_config_path: configs/base_config.yaml
  real_split: train   # train | eval_in_distribution | eval_out_of_distribution

memory_store:
  n_memories: 30          # per signal_boost_check's recommendation (Part A follow-up)
  lesson_min_tokens: 100  # memories are short "lessons", not full trajectories
  lesson_max_tokens: 300

retrieval:
  M: 10                    # unchanged from Stage 1
  propensity_min: 0.3      # per signal_boost_check's recommendation (was 0.1 in Stage 1 default)
  propensity_max: 0.7      # per signal_boost_check's recommendation (was 0.9 in Stage 1 default)

llm:
  # Chosen 2026-09-19 after Part C's model-selection test (results/
  # model_selection_test.json): openai/gpt-5.6-luna over inclusionai/
  # ling-3.0-flash-vl (cheaper but 28% parse-failure rate vs. gpt-5.6-luna's
  # ~4% -- disqualifying since failures may scale with prompt size, and
  # therefore with how many memories are included, which would confound
  # the very thing this pilot measures) and over google/gemini-3.8-flash
  # (fails outright: mandatory reasoning, incompatible with reasoning_enabled: false below).
  model_id: openai/gpt-5.6-luna
  base_url: "https://openrouter.ai/api/v1"
  api_key_env_var: OPENROUTER_API_KEY
  reasoning_enabled: false   # sent as {"reasoning": {"enabled": false}}; some models reject this (mandatory reasoning) -- see llm_client.py
  temperature: 0.0           # 0 for determinism; ground-truth paired runs also try a fixed `seed` param when the provider supports it
  max_output_tokens: 100     # a ReAct Thought+Action is short
  # Fetched from https://openrouter.ai/api/v1/models on 2026-09-19 -- re-check before reuse.
  pricing_per_million_tokens:
    input: 0.20
    output: 1.20

cost_control:
  # Reset 2026-09-19: user's real remaining OpenRouter balance is $3.84
  # (after the $0.063 already spent on the model-selection test, tracked
  # separately in model_selection_test_cost_state.json, not this cap).
  # 3.00 leaves a real buffer below the true remaining balance so a run
  # never hits an actual empty-wallet failure mid-episode.
  hard_cap_usd: 3.00   # run stops itself once cumulative spend reaches this
  # measure_mode runs a small number of episodes, records actual
  # input/output tokens per call, and projects total cost for the full
  # plan (see ../results/stage2_budget_estimate.json for that plan). Kept
  # small (2) now that env.backend defaults to "real": each episode
  # constructs/steps a real ALFWorld game, not a mock, so this is no longer
  # a free instant loop.
  measure_mode_n_episodes: 2

cache:
  dir: cache   # relative to this directory; every LLM call is cached here, keyed by a hash of (model, messages, params)

paths:
  logs_dir: logs
  results_dir: results

ground_truth:
  # Rescaled 2026-09-19 (see ../results/ground_truth_power_analysis_rescale.json):
  # within a 5000-episode ground-truth budget (matching the new
  # main_randomized_logging scale), 15 memories x 166 pairs/memory gives
  # MDE~0.137 at 80% power -- MORE memories covered AND a tighter MDE than
  # the original 10-memory/100-pair plan's ~0.177 at the old 2000-episode
  # budget.
  n_memories: 15
  pairs_per_memory: 166
  # Selection uses a HELD-OUT split of the main logging phase (first half
  # for selection, second half for the estimates that get compared against
  # ground truth) -- see ground_truth_selection_bias_check.py in the main
  # Stage 1 package for why.

# Rescaled 2026-09-19 for Part C (see CLAUDE.md): main_randomized_logging
# raised from 1000 -> 5000 per scale_up_check.py (at n=3000+, IPS/SNIPS/DR's
# 95% Spearman interval reliably excludes zero on BOTH Stage 1 confound
# simulators; 5000 gives the best mean Spearman of the range tested at
# negligible added real-measured cost). ground_truth_reruns raised to match
# (15 memories x 166 pairs x 2 arms).
episode_plan:
  memory_store_construction: 50
  main_randomized_logging: 5000
  ground_truth_reruns: 4980   # 15 memories x 166 pairs x 2 arms
